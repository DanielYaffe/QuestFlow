services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - ./backend/.env
    depends_on:
      - redis
      - mongo
      - qdrant

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: tsx src/worker.ts
    env_file:
      - ./backend/.env
    depends_on:
      - redis
      - mongo
      - qdrant

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  qdrant:
    image: qdrant/qdrant:v1.18.2
    ports:
      - "6333:6333"   # REST/HTTP (QDRANT_URL)
      - "6334:6334"   # gRPC (optional)
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  mongo_data:
  qdrant_data:
