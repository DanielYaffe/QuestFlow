[project]
name = "questflow-eval"
version = "0.1.0"
description = "LoRA evaluation harness for QuestFlow — generates from ComfyUI, scores with CLIP/DINOv2/FID/LPIPS, produces ranked reports."
requires-python = "==3.11.*"
dependencies = [
    "torch==2.3.1",
    "torchvision==0.18.1",
    "open_clip_torch==2.24.0",
    "lpips==0.1.4",
    "clean-fid==0.1.35",
    "pillow==10.3.0",
    "numpy==1.26.4",
    "pandas==2.2.2",
    "scikit-learn==1.5.0",
    "scipy==1.13.1",
    "matplotlib==3.9.0",
    "seaborn==0.13.2",
    "pyyaml==6.0.1",
    "requests==2.32.3",
    "tqdm==4.66.4",
    "tenacity==8.3.0",
    "pydantic==2.7.4",
    "typer>=0.15.0",
    "rembg==2.0.57",
    "safetensors==0.4.3",
]

[project.scripts]
questflow-eval = "questflow_eval.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/questflow_eval"]

[dependency-groups]
dev = [
    "pytest==8.2.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.uv]
package = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu121" }]
torchvision = [{ index = "pytorch-cu121" }]

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true
