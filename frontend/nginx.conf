# Served as /etc/nginx/conf.d/default.conf — the base image's nginx.conf already
# provides the surrounding http {} block.
#
# This serves static files only. The /api split lives in the edge proxy
# (../Caddyfile), so this config has no idea where the backend is and the image
# stays portable across environments.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Vite emits content-hashed filenames under /assets, so a new build produces
    # new names rather than stale hits — safe to cache forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must never be cached: it is what points at the hashed bundles,
    # and a cached copy sends browsers looking for asset names a deploy removed.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # The app uses HashRouter (App.tsx:46), so routes live in the URL fragment
    # and never reach nginx. This fallback only catches stray deep links from
    # before the hash router, and costs nothing to keep.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Plain-text probe for the compose healthcheck — cheaper than fetching
    # index.html and unambiguous in logs.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
