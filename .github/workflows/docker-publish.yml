name: Build and push images

# Builds the two application images and pushes them to Docker Hub.
#
# The backend image also runs the worker — same image, different CMD (see the
# worker service in docker-compose.yml) — so two builds cover all three app
# services. The RunPod ComfyUI images in runpod-build/ are not built here: they
# pull multi-GB checkpoints from Civitai and would not fit a free runner's disk.

# Only published images are built. A merged PR lands as a push to main, which
# is the trigger below — open PRs build nothing.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  # A newer push makes an in-flight build of the same ref pointless.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    strategy:
      # One failing image should not cancel the other's build; both results are
      # more useful than a race to the first error.
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: ./backend
            image: questflow-backend
          - name: frontend
            context: ./frontend
            image: questflow-frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # backend/vendor/pixel-snapper is a submodule and stage 1 of the
          # backend Dockerfile compiles it with wasm-pack. Without this the
          # build fails on an empty directory.
          submodules: recursive

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          # Without a cache every run recompiles the WASM crate and re-downloads
          # the 168 MB background-removal weights.
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          provenance: false
